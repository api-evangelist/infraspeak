aid: infraspeak
name: Infraspeak
description: >-
  Infraspeak is an intelligent facilities and maintenance management platform (CMMS/IWMS/IFM)
  founded in Porto, Portugal, that connects an entire operation with end-to-end collaboration,
  complete asset visibility, and intelligent automation. Facility and maintenance teams use
  Infraspeak to manage assets, work orders, preventive maintenance schedules, failures, stock,
  suppliers, and contracts across buildings and sites. The platform exposes a public REST API
  (currently v3) hosted at api.infraspeak.com and documented on Stoplight, plus a growing
  integrations layer ("Infraspeak Hub") with connectors for ERP, PMS, BMS, energy, and
  collaboration systems such as SAP, Xero, and Opera. Infraspeak is backed by 500 Global and
  other investors.
